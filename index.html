<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TribeTown</title>
  <link rel="stylesheet" href="css/tribetown.css">

  
</head>
<body>
  <header class="topbar">
    <span class="logo-blue">Tribe</span><span class="logo-red">Town</span>
  </header>

  <main class="layout">

    <section class="campus">
      <div class="page-heading">
        <div>
          <h1>Vind elkaar op school</h1>
        </div>
        <p class="floor">Verdieping 2</p>
      </div>

      <div class="map">
        <section class="room room-one">
          <h2>Lokaal 2.01</h2>
          <span class="student-dot yellow dot-amir" aria-label="Amir"></span>
          <span class="student-dot red dot-selim" aria-label="Selim"></span>
          <span class="student-dot green dot-noor" aria-label="Noor"></span>
        </section>

        <section class="room room-two">
          <h2>Lokaal 2.02</h2>
          <span class="student-dot red dot-daan" aria-label="Daan"></span>
          <span class="student-dot yellow dot-yara" aria-label="Yara"></span>
        </section>

        <section class="room room-three">
          <h2>Lokaal 2.03</h2>
          <span class="student-dot yellow dot-luuk" aria-label="Luuk"></span>
        </section>

        <section class="room room-four">
          <h2>Lokaal 2.04</h2>
          <span class="student-dot red dot-lina" aria-label="Lina"></span>
          <span class="student-dot red dot-adam" aria-label="Adam"></span>
        </section>

        <section class="room room-five">
          <h2>Lokaal 2.05</h2>
          <span class="student-dot green dot-sara" aria-label="Sara"></span>
          <span class="student-dot yellow dot-mila" aria-label="Mila"></span>
          <span class="student-dot red dot-finn" aria-label="Finn"></span>
        </section>

        <section class="room room-six">
          <h2>Lokaal 2.06</h2>
          <span class="student-dot green dot-emma" aria-label="Emma"></span>
          <span class="student-dot red dot-jay" aria-label="Jay"></span>
        </section>
      </div>
    </section>

    <aside class="side-panel">
      <section>
        <p class="small-heading">JOUW PLEK</p>
        <h2>Ik zit hier</h2>

        <div class="field-box"></div>
        <div class="field-box"></div>

        <div class="status-buttons">
          <span class="status-button"><span class="status-dot green"></span>Aanschuiven</span>
          <span class="status-button"><span class="status-dot yellow"></span>Vragen</span>
          <span class="status-button"><span class="status-dot red"></span>Focus</span>
        </div>

        <div class="field-box"></div>
        <div class="share-button">Deel mijn status</div>
      </section>

      <section class="connections">
        <p class="small-heading">TRIBES OM JE HEEN</p>
        <div class="connections-heading">
          <h2>Mijn verbindingen</h2>
          <strong>10</strong>
        </div>
        <p class="connection-text">Studenten leren kennen<br>uit 3 verschillende tribes</p>
        <h3>Online nu</h3>
      </section>
    </aside>
  </main>
</body>
</html>
