<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/tribetown.css">
    <link rel="stylesheet" href="css/profiel.css">
</head>

<body>
    <nav>
        <header class="balk">Tribe<span>Spot</span></header>
        <ul>
            <li><a href="index.html">Plattegrond</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="kamer.html">Kamers</a></li>
            <li><a href="profiel.html">Profiel</a></li>
        </ul>
         
    </nav>


    <main>
        <aside class="kaart">
            <div class="avatar" id="avatar"></div>
            <h2 id="naam"></h2>
            <p id="tribe"></p>
                        <h3>Interesses</h3>
            <div id="interesses"></div>

            <h3>Kan helpen met</h3>
            <div id="helpen"></div>

                        <button id="bewerk-knop">Profiel bewerken</button>


        </aside>

               <section>
            <div class="kaart">
                <h2>Mijn verbindingen</h2>
                <p id="aantal-verbindingen"></p>
                <p id="verbindingen-tekst"></p>

                <div class="balk-buiten">
                    <div class="balk-binnen" id="balk"></div>
                </div>

                <div id="stipjes"></div>
            </div>

            <div class="kaart">
                <h2 id="badge-titel"></h2>
                <p id="badge-tekst"></p> 
                  <div id="kaart-logo">Tribe<span>Spot</span></div>

                 <form id="bewerk-formulier" hidden>
                <label>Naam
                    <input type="text" id="invoer-naam">
                </label>

                <label>Studiejaar
                    <select id="invoer-studiejaar">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </label>

                <label>Tribe
                    <select id="invoer-tribe">
                        <option value="A">Tribe A</option>
                        <option value="B">Tribe B</option>
                        <option value="C">Tribe C</option>
                    </select>
                </label>

                <div class="interesse-groep">
                                    </div>

                <p>Interesses</p>
                <label class="vinkje"><input type="checkbox" name="interesse" value="Games"> Games</label>
                <label class="vinkje"><input type="checkbox" name="interesse" value="Muziek"> Muziek</label>
                <label class="vinkje"><input type="checkbox" name="interesse" value="Sport"> Sport</label>
                <label class="vinkje"><input type="checkbox" name="interesse" value="Design"> Design</label>
                <label class="vinkje"><input type="checkbox" name="interesse" value="Code"> Code</label>

                <label>Kan helpen met
                    <input type="text" id="invoer-helpen">
                </label>

                <p id="bewerk-melding"></p>
                <button type="submit">Opslaan</button>
            </form>
            </div>
        </section>


    </main>
            <script src="js/navbar.js"></script>

        <script src="js/profiel.js"></script>

</body>

</html>
