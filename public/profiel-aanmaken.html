<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiel aanmaken - TribeSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profiel-aanmaken.css">
    <script src="js/validatie.js" defer></script>
</head>
<body>
    <header class="balk">Tribe<span>Spot</span></header>

    <div class="kaart">
        <span class="label">Account aanmaken</span>
        <h1>Welkom!</h1>
        <p>Maak je profiel aan en vind andere studenten op de plattegrond.</p>

        <div class="naast">
            <div>
                <label>Naam</label>
                <input type="text" class="profile-name" placeholder="Je naam">
            </div>
            <div>
                <label>Gebruikersnaam</label>
                <input type="text" class="profile-username" placeholder="Zo zien anderen jou">
            </div>
        </div>

        <div class="naast">
            <div>
                <label>HU-e-mailadres</label>
                <input type="email" class="profile-email" placeholder="naam@student.hu.nl">
            </div>
            <div>
                <label>Wachtwoord</label>
                <input type="password" class="profile-password" placeholder="Kies een wachtwoord">
            </div>
        </div>

        <label>Studiejaar</label>
        <select>
            <option>Jaar 1</option>
            <option>Jaar 2</option>
            <option>Jaar 3</option>
            <option>Jaar 4</option>
        </select>

        <label>Tribe</label>
        <div class="rij tribe-row">
            <label class="keuze"><input type="radio" name="tribe"> <span class="stip rood"></span> Tribe A</label>
            <label class="keuze"><input type="radio" name="tribe"> <span class="stip blauw"></span> Tribe B</label>
            <label class="keuze"><input type="radio" name="tribe"> <span class="stip groen"></span> Tribe C</label>
        </div>

        <label>Interesses</label>
        <div class="rij">
            <label class="knopje"><input type="checkbox"> Games</label>
            <label class="knopje"><input type="checkbox"> Muziek</label>
            <label class="knopje"><input type="checkbox"> Sport</label>
            <label class="knopje"><input type="checkbox"> Design</label>
            <label class="knopje"><input type="checkbox"> Code</label>
        </div>

        <label>Ik kan helpen met</label>
        <input type="text" class="profile-help" placeholder="Bijv. HTML, CSS of Python">

        <button class="start profile-button">Start</button>

        <p class="onderaan">Al een profiel? <a href="inloggen.html">Log in</a></p>
    </div>
</body>
</html>
