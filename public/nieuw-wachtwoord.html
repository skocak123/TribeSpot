<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw wachtwoord - TribeSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inloggen.css">
</head>

<body>
    <header class="balk">Tribe<span>Spot</span></header>

    <div class="kaart">
        <span class="label">Wachtwoord</span>
        <h1>Nieuw wachtwoord</h1>
        <p>Kies een nieuw wachtwoord van minstens 8 tekens.</p>

        <form id="formulier">
            <label for="wachtwoord">Nieuw wachtwoord</label>
            <input type="password" id="wachtwoord" minlength="8" required>

            <label for="herhaal">Herhaal wachtwoord</label>
            <input type="password" id="herhaal" minlength="8" required>

            <button type="submit" class="start">Opslaan</button>
        </form>

        <p id="melding" class="melding" hidden></p>
        <p class="onderaan"><a href="inloggen.html">Naar inloggen</a></p>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get("token");
        const melding = document.getElementById("melding");

        document.getElementById("formulier").addEventListener("submit", async function (e) {
            e.preventDefault();

            const wachtwoord = document.getElementById("wachtwoord").value;
            const herhaal = document.getElementById("herhaal").value;

            if (wachtwoord !== herhaal) {
                melding.textContent = "De wachtwoorden zijn niet hetzelfde.";
                melding.hidden = false;
                return;
            }

            const antwoord = await fetch("/api/nieuw-wachtwoord", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, wachtwoord })
            });
            const data = await antwoord.json();

            melding.textContent = data.bericht || data.fout;
            melding.hidden = false;
        });
    </script>
</body>
</html>
