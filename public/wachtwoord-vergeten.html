<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord vergeten - TribeSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inloggen.css">
</head>

<body>
    <header class="balk">Tribe<span>Spot</span></header>

    <div class="kaart">
        <span class="label">Wachtwoord</span>
        <h1>Wachtwoord vergeten?</h1>
        <p>Vul je HU-e-mailadres in, dan sturen we je een link om een nieuw wachtwoord te kiezen.</p>

        <form id="formulier">
            <label for="email">HU-e-mailadres</label>
            <input type="email" id="email" placeholder="naam@student.hu.nl" required>
            <button type="submit" class="start">Verstuur link</button>
        </form>

        <p id="melding" class="melding" hidden></p>

        <p class="onderaan"><a href="inloggen.html">Terug naar inloggen</a></p>
    </div>

    <script>
        const melding = document.getElementById("melding");

        document.getElementById("formulier").addEventListener("submit", async function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value;

            try {
                const antwoord = await fetch("/api/wachtwoord-vergeten", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await antwoord.json();

                melding.textContent = data.bericht || data.fout;
            } catch (fout) {
                melding.textContent = "De server reageert niet. Draait hij wel?";
            }

            melding.hidden = false;
        });
    </script>
</body>
</html>
