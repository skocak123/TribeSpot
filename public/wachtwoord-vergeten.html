<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord vergeten</title>
    <link rel="stylesheet" href="css/wachtwoord-vergeten.css">
</head>

<body>
    <header class="logo">
        <nav><span class="blauw">Tribe</span><span class="rood">Spot</span></nav>
    </header>

    <main>
        <section class="kaart">
            <h1>Wachtwoord vergeten?</h1>
            <p>Vul je HU-e-mailadres in, dan sturen we je een link om een nieuw wachtwoord te kiezen.</p>

            <form id="formulier">
                <label for="email">HU-e-mailadres</label>
                <input type="email" id="email" placeholder="naam@student.hu.nl" required>
                <button type="submit">Verstuur link</button>
            </form>

            <p id="melding" hidden>Er is een mail gestuurd!</p>

            <p><a href="inloggen.html">Terug naar inloggen</a></p>
        </section>
    </main>

   <script>
    document.getElementById("formulier").addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value;

        await fetch("/api/wachtwoord-vergeten", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        document.getElementById("melding").hidden = false;
    });
    </script>
</body>
</html>
