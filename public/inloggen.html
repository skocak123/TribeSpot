<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - TribeSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inloggen.css">
</head>
<body>
    <header class="balk">Tribe<span>Spot</span></header>

    <div class="kaart">
        <span class="label">Inloggen</span>
        <h1>Welkom terug!</h1>
        <p>Log in en vind andere studenten op de plattegrond.</p>

     <form id="inlogformulier">

        <label for="email">HU-e-mailadres</label>
        <input type="email" id="email" name="email" placeholder="naam@student.hu.nl" required>

        <label for="wachtwoord">Wachtwoord</label>
        <input type="password" id="wachtwoord" name="wachtwoord" placeholder="Je wachtwoord" required>

        <p id="foutmelding" class="foutmelding" hidden></p>
       
        <a href="wachtwoord-vergeten.html" class="vergeten">Wachtwoord vergeten?</a>

        <button type="submit" class="start">Inloggen</button>

    </form>

        <p class="onderaan">Nog geen profiel? <a href="profiel-aanmaken.html">Maak er een aan</a></p>
    </div>
    <script src="js/inloggen.js"></script>
</body>
</html>
