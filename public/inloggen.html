<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - TribeSpot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inloggen.css">
</head>
<body>
    <header class="balk">Tribe<span>Spot</span></header>

    <div class="kaart">
        <span class="label">Inloggen</span>
        <h1>Welkom terug!</h1>
        <p>Log in en vind andere studenten op de plattegrond.</p>

        <label>HU-e-mailadres</label>
        <input type="email" placeholder="naam@student.hu.nl">

        <label>Wachtwoord</label>
        <input type="password" placeholder="Je wachtwoord">

        <a href="#" class="vergeten">Wachtwoord vergeten?</a>

        <button class="start">Inloggen</button>

        <p class="onderaan">Nog geen profiel? <a href="profiel-aanmaken.html">Maak er een aan</a></p>
    </div>
</body>
</html>
